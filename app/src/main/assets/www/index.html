<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Meridian</title>
<style>
  :root, html[data-theme="dark"] {
    --bg:#000; --fg:#f3ead7; --muted:#a89884; --line:rgba(196,164,106,.18);
    --accent:#c4a46a; --card:#161310; --plate:#16130f; --field:#120f0c; --navbg:#100e0c;
    --btn:#c4a46a; --btnfg:#1a140c; --header:rgba(18,15,12,.96); --win:#100e0c;
    --grid:rgba(196,164,106,.16); --ico:#f3ead7; --chip:#241c14; --top:#241c16;
    --ink:#1a140c; --termbg:#0c0a08; --termfg:#f3ead7; --track:#2a2e2a; --gaugetrack:#1a1612;
    --paper:#100e0c; --bad:#ef4444; --accent2:#e4d2ae;
    color-scheme: dark;
  }
  html[data-theme="light"] {
    --bg:#f3ecdf; --fg:#1c1610; --muted:#6d5d4c; --line:rgba(80,55,20,.18);
    --accent:#8a6a3e; --card:#fffaf3; --plate:#fffaf3; --field:#fff; --navbg:#efe6d8;
    --btn:#8a6a3e; --btnfg:#fffaf3; --header:rgba(246,241,232,.97); --win:#f6efe4;
    --grid:rgba(138,106,62,.16); --ico:#1c1610; --chip:#fff; --top:#efe6d8;
    --ink:#fffaf3; --termbg:#1c1610; --termfg:#f3ead7; --track:#d8cdb8; --gaugetrack:#e6dccb;
    --paper:#fffaf3; --bad:#b91c1c; --accent2:#5a4426;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100dvh; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  header { position: sticky; top: 0; z-index: 8; flex: none; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 10px; background: var(--header); border-bottom: 1px solid var(--line); }
  header > div { min-width: 0; }
  header h1 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0; color: var(--fg); white-space: nowrap; }
  header p { margin: 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  #clock { color: var(--fg); font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .leads { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .leads div { min-width: 0; text-align: center; padding: 8px 2px; border-radius: 12px; background: var(--plate); border: 1px solid var(--line); }
  .leads b { display: block; color: var(--accent); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .leads span { color: var(--muted); font-size: 11px; letter-spacing: .04em; }
  .osx {
    --bg-light: #3a3024;
    --bg-dark: #14110e;
    --accent: #c4a46a;
    --glow: rgba(196,164,106,.45);
    --spin-speed: 3s;
    --pulse-speed: 2s;
    width: 74px;
    height: 74px;
    margin: 2px auto 0;
    position: relative;
    border-radius: 22px;
    background: linear-gradient(145deg, var(--bg-light), var(--bg-dark));
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15), inset 0 -1px 2px rgba(0, 0, 0, 0.4), 0 12px 20px rgba(0, 0, 0, 0.4), 0 0 20px var(--glow);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .osx b {
    position: absolute;
    inset: 12px;
    margin: 0;
    border-radius: 50%;
    border: 2px solid transparent;
    background: linear-gradient(var(--bg-dark), var(--bg-dark)) padding-box, conic-gradient(from 0deg, transparent 0%, var(--accent) 50%, transparent 100%) border-box;
    animation: osx-spin var(--spin-speed) linear infinite;
  }
  .osx b::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 3px;
    height: 22px;
    border-radius: 4px;
    background: #ffffff;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px #ffffff, 0 0 16px var(--accent);
    animation: osx-pulse var(--pulse-speed) ease-in-out infinite;
  }
  .osx.bad { --bg-light: #3f1515; --bg-dark: #1a0505; --accent: #ef4444; --glow: rgba(239, 68, 68, 0.5); --spin-speed: 0.8s; --pulse-speed: 0.4s; }
  .osx.bad + .status-text, .osx.bad ~ .status-text { color: var(--bad); text-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
  @keyframes osx-spin { 100% { transform: rotate(360deg); } }
  @keyframes osx-pulse { 0%, 100% { opacity: 1; height: 22px; } 50% { opacity: 0.4; height: 12px; } }
  .osx.mini { width: 16px; height: 16px; margin: 0; border-radius: 5px; flex: none; box-shadow: none; }
  .osx.mini b { inset: 2px; animation: none; }
  .osx.mini b::after { width: 1px; height: 8px; animation: none; }
  .osx.bar { width: 28px; height: 28px; min-height: 28px; margin: 0; padding: 0; border: 0; border-radius: 8px; z-index: 1; flex: none; }
  .osx.bar b { inset: 5px; animation: none; }
  .osx.bar b::after { height: 10px; animation: none; }
  .osxtile { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .healthrow { display: flex; justify-content: center; }
  .healthrow .tile { width: 168px; }
  .planhead .osx { width: 52px; height: 52px; min-width: 52px; min-height: 52px; margin: 0; border-radius: 16px; flex: none; align-self: center; }
  .planhead .osx b { inset: 8px; }
  .planhead .osx b::after { height: 14px; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .ghost, .btn { border-radius: 14px; min-height: 44px; padding: 0 14px; }
  header .ghost { min-height: 36px; padding: 0 10px; font-size: 12px; flex: none; border-radius: 10px; }
  header .ghost.on { color: var(--accent); border-color: var(--accent); }
  .ghost { background: transparent; border: 1px solid rgba(196,164,106,.55); color: var(--accent); }
  .ghost.danger, .btn.danger { color: var(--bad); border-color: var(--bad); }
  .win .ghost { background: var(--field); color: var(--fg); border: 1px solid rgba(196,164,106,.75); font-weight: 650; border-radius: 16px; box-shadow: inset 0 1px 0 rgba(243,234,215,.14); }
  .win .ghost.danger { color: var(--bad); border-color: var(--bad); }
  .modes .ghost { background: var(--chip); color: var(--fg); border: 2px solid var(--accent); font-weight: 700; }
  .modes .ghost.on { background: var(--accent); color: var(--ink); }
  button:disabled { opacity: .55; cursor: default; }
  .btn { background: var(--field); color: var(--fg); border: 1px solid rgba(196,164,106,.75); font-weight: 650; width: 100%; border-radius: 16px; box-shadow: inset 0 1px 0 rgba(243,234,215,.14); }
  #moreback, #shelfback { align-self: flex-start; width: auto; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px 0 12px; }
  #moreback::before, #shelfback::before { content: ""; width: 8px; height: 8px; border-left: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor; transform: rotate(45deg); margin-left: 2px; }
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: stretch; }
  .pair .tile { min-width: 0; height: 158px; overflow: hidden; }
  .gauge { width: 78px; height: 78px; margin: 6px auto 0; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--gaugetrack) 0); display: grid; place-items: center; box-shadow: 0 0 16px rgba(196,164,106,.2); }
  .gauge b { width: 58px; height: 58px; border-radius: 50%; background: var(--plate); display: grid; place-items: center; color: var(--accent); font-size: 15px; }
  .tile span { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile span.fit { white-space: normal; overflow: visible; text-overflow: clip; line-height: 1.25; }
  .spark { width: 100%; height: 52px; display: block; }
  .corebars { height: 92px; display: flex; align-items: flex-end; gap: 3px; }
  .corebars span { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
  .corebars i { width: 100%; display: block; border-radius: 3px 3px 0 0; background: linear-gradient(#f3ead7, var(--accent)); box-shadow: 0 0 8px rgba(196,164,106,.35); }
  .corebars b { margin-top: 3px; font-size: 9px; font-weight: 650; line-height: 1; color: var(--muted); }
  .system-core {
    --hue: 142;
    --sat: 100%;
    --glow-bright: hsla(var(--hue), var(--sat), 60%, 1);
    --glow-dim: hsla(var(--hue), var(--sat), 40%, 0.4);
    --core-dark: hsla(var(--hue), var(--sat), 6%, 1);
    --speed-mult: 1s;
    position: relative;
  }
  .system-core.bad { --hue: 0; --speed-mult: 0.3s; }
  .stage { width: 190px; height: 190px; margin: 0 auto; perspective: 800px; display: block; }
  .orb { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; animation: floaty 6s ease-in-out infinite; }
  .orb * { position: absolute; border-radius: 50%; transform-style: preserve-3d; box-sizing: border-box; }
  .orb u, .orb i, .orb em, .orb s { inset: 0; border: 2px solid transparent; }
  .orb u { inset: 0; border: 1px solid var(--glow-dim); transform: rotateX(76deg); animation: spin calc(14 * var(--speed-mult)) linear infinite; box-shadow: 0 0 20px var(--glow-dim) inset; }
  .orb i { inset: 10px; border: 1.5px solid var(--glow-bright); border-bottom-color: transparent; border-left-color: transparent; transform: rotateY(68deg) rotateX(18deg); animation: spin calc(8 * var(--speed-mult)) linear infinite; }
  .orb em { inset: 24px; border: 1px dashed var(--glow-bright); transform: rotateX(66deg) rotateZ(16deg); animation: spin calc(11 * var(--speed-mult)) linear infinite reverse; opacity: 0.75; }
  .orb s { inset: 36px; border: 1.5px solid var(--glow-dim); border-top-color: var(--glow-bright); text-decoration: none; transform: rotateY(78deg) rotateZ(40deg); animation: spin calc(5 * var(--speed-mult)) linear infinite; }
  .orb b { inset: 50px; background: radial-gradient(circle at 32% 28%, #fff 0 4%, var(--glow-bright) 18%, var(--core-dark) 62%, #000 100%); box-shadow: inset -8px -10px 14px rgba(0,0,0,0.85), inset 5px 6px 8px rgba(255,255,255,0.35), 0 0 18px var(--glow-dim); }
  .orb b::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background-image: linear-gradient(transparent 90%, var(--glow-dim) 100%), linear-gradient(90deg, transparent 90%, var(--glow-dim) 100%); background-size: 10px 10px; opacity: 0.3; animation: gridPulse 2s infinite alternate; }
  .status-text { margin-top: 16px; text-align: center; font-weight: 700; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); text-shadow: 0 0 10px rgba(196,164,106,.45); transition: color 0.4s ease; }
  @keyframes floaty { 0%, 100% { transform: rotateX(16deg) rotateY(-14deg); } 50% { transform: rotateX(20deg) rotateY(14deg) translateY(-3px); } }
  @keyframes spin { to { transform: rotate3d(1, 1, 1, 360deg); } }
  @keyframes gridPulse { to { background-size: 12px 12px; opacity: 0.6; } }
  .linkline { text-align: center; font-weight: 750; letter-spacing: .02em; padding: 8px 0 10px; border-bottom: 2px solid var(--accent); box-shadow: 0 10px 22px rgba(196,164,106,.28); }
  #main { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 8px 10px calc(84px + env(safe-area-inset-bottom)); }
  body.term #main { padding-bottom: calc(148px + env(safe-area-inset-bottom)); }
  .win { display: flex; flex-direction: column; height: auto; max-height: 100%; flex: 0 1 auto; min-height: 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--accent); box-shadow: none; background: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px), var(--win); background-size: 18px 18px, 18px 18px, auto; }
  .winbody { flex: 1; min-height: 0; overflow: auto; padding: 12px; }
  .pair.sens .tile { height: auto; min-height: 86px; }
  .wintop { position: relative; display: flex; align-items: center; height: 44px; padding: 0 12px; background: linear-gradient(var(--top), var(--plate)); border-bottom: 1px solid var(--line); }
  .wintop > b { position: absolute; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 650; pointer-events: none; }
  .desk .sec { padding: 10px 12px 0; }
  .sec.mach { color: var(--accent); }
  .sec.lib { color: var(--muted); }
  .bend { height: 16px; margin: 0 20px; border-bottom: 1px solid rgba(126,200,255,.4); border-left: 1px solid rgba(255,193,77,.45); border-radius: 0 0 0 22px; }
  .winbody { padding: 12px; }
  .page { display: flex; flex-direction: column; min-height: 0; }
  .brandfill { flex: 1; min-height: 140px; display: flex; align-items: center; justify-content: center; padding: 36px 0 48px; }
  .logo { width: 104px; height: 104px; position: relative; }
  .logo i, .logo b, .logo s { position: absolute; border-radius: 50%; }
  .logo i:nth-child(1) { inset: 0; border: 1px solid rgba(116,201,74,.22); }
  .logo i:nth-child(2) { inset: 8px; border: 1.5px solid transparent; border-top-color: var(--accent); border-left-color: rgba(116,201,74,.4); animation: spin 14s linear infinite; }
  .logo i:nth-child(3) { inset: 22px; border: 1px solid transparent; border-right-color: var(--accent); border-bottom-color: rgba(116,201,74,.28); animation: spin 9s linear infinite reverse; }
  .logo s { inset: 34px; border: 1px dashed rgba(116,201,74,.55); text-decoration: none; animation: spin 22s linear infinite; }
  .logo b { inset: 44px; border: 1px solid var(--accent); background: radial-gradient(circle, var(--accent) 0 2px, transparent 3px); }
  .idea { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 4px; background: var(--plate); border: 1px solid rgba(196,164,106,.55); border-radius: 18px; padding: 14px 16px; box-shadow: 0 0 0 1px rgba(196,164,106,.2), 0 0 18px rgba(196,164,106,.16); }
  .idea b { font-size: 16px; }
  .idea span { color: var(--muted); font-size: 13px; }
  .aboutbtn { width: auto; align-self: center; min-height: 36px; margin: 0; padding: 0 14px; display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; background: var(--accent); color: var(--ink); border: 0; font-size: 13px; font-weight: 700; letter-spacing: .02em; }
  .aboutrow { display: flex; justify-content: center; gap: 8px; margin: 10px auto 4px; }
  .hint { margin: 0 0 8px; color: var(--muted); font-size: 13px; line-height: 1.4; }
  .aboutbtn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile, .plate { background: var(--plate); border: 2px solid rgba(196,164,106,.72); border-radius: 16px; box-shadow: none; }
  .tile { padding: 12px; }
  .plate { padding: 14px; }
  .tile .k, .plate .k { color: var(--muted); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
  .tile b { display: block; margin-top: 4px; font-size: 22px; font-weight: 650; letter-spacing: -.03em; color: var(--accent); font-variant-numeric: tabular-nums; }
  .osxtile .osx b { margin: 0; font-size: 0; font-weight: 400; letter-spacing: 0; color: transparent; }
  .tile span { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile span.fit { white-space: normal; overflow: visible; text-overflow: clip; line-height: 1.25; }
  .cores { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; margin-top: 8px; }
  .core { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; padding: 3px 0; white-space: nowrap; }
  .core span { color: var(--muted); white-space: nowrap; font-size: 13px; }
  .core b { white-space: nowrap; font-size: 13px; font-variant-numeric: tabular-nums; }
  .core b::after { content: " MHz"; font-size: 10px; font-weight: 550; color: var(--muted); }
  .bar { display: block; height: 7px; margin-top: 8px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width 400ms ease-out; }
  .sec { color: var(--accent); font-weight: 650; margin: 0 0 6px; }
  .kv { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 8px 0; border-top: 2px solid rgba(196,164,106,.4); }
  .kv span { color: var(--muted); flex: none; }
  .kv b { min-width: 0; flex: 1; font-weight: 650; text-align: right; font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; word-break: break-word; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  h2 { margin: 0; font-size: 22px; }
  .muted { color: var(--muted); }
  .plate p, .muted { overflow-wrap: anywhere; }
  pre { margin: 0; white-space: pre; overflow: auto; word-break: normal; overflow-wrap: normal; font: 12px/1.45 ui-monospace, monospace; background: var(--field); color: var(--fg); border: 1px solid rgba(196,164,106,.45); border-radius: 12px; padding: 10px 12px; }
  .term { max-height: 62vh; overflow: auto; background: var(--termbg); color: var(--termfg); border: 1px solid rgba(196,164,106,.45); border-radius: 12px; padding: 12px 10px; font: 12px/1.45 ui-monospace, monospace; }
  .term .line, .term .out { white-space: pre; width: max-content; min-width: 100%; font: inherit; }
  .term.wrap .line, .term.wrap .out { white-space: pre-wrap; overflow-wrap: anywhere; width: auto; }
  .term .line { margin: 0 0 2px; }
  .term .out { margin: 0 0 14px; color: var(--termfg); }
  .term .ps { color: var(--accent); }
  .term .out.fail { color: #f0a4a4; }
  .termacts { display: flex; flex-direction: column; gap: 8px; }
  .runbar { display: flex; align-items: center; gap: 8px; }
  .runbar .pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: blink 1.1s steps(1) infinite; flex: none; }
  .runbar .ghost { width: auto; min-height: 36px; padding: 0 12px; }
  .runbar .muted { flex: 1; font-size: 13px; }
  textarea.cmd { display: block; padding: 10px 12px; line-height: 1.45; font: 13px/1.45 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; overflow: auto; resize: vertical; min-height: 72px; }
  textarea, input { width: 100%; background: var(--field); color: var(--fg); border: 2px solid rgba(196,164,106,.72); border-radius: 12px; padding: 12px; }
  nav { position: fixed; left: 10px; right: 10px; bottom: calc(8px + env(safe-area-inset-bottom)); display: flex; gap: 0; background: var(--header); border: 1px solid var(--line); border-radius: 22px; z-index: 5; padding: 6px 2px 4px; box-shadow: 0 12px 28px rgba(0,0,0,.28); overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; }
  nav::-webkit-scrollbar { display: none; }
  nav button { position: relative; flex: 1 0 64px; min-width: 0; min-height: 52px; border: 0; background: transparent; color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: .01em; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; white-space: nowrap; scroll-snap-align: start; }
  nav button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  nav button.on { color: var(--accent); }
  nav button.on::before { content: ""; position: absolute; top: 2px; left: 50%; width: 18px; height: 3px; border-radius: 3px; background: var(--accent); transform: translateX(-50%); }
  nav button.lock::after { content: "PRO"; position: absolute; top: 4px; right: 6px; font-size: 7px; font-weight: 800; letter-spacing: .08em; padding: 1px 4px; border-radius: 6px; background: var(--accent); color: var(--ink); line-height: 1.2; }
  .probadge { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .08em; padding: 2px 6px; border-radius: 6px; background: var(--accent); color: var(--ink); vertical-align: middle; margin-left: 6px; }
  .trialline { text-align: center; color: var(--muted); font-size: 12px; margin: 0 0 8px; }
  .trialline button { background: none; border: 0; padding: 0; min-height: 0; color: var(--accent); font: inherit; text-decoration: underline; }

    nav { top: 58px; bottom: 10px; right: auto; width: 88px; flex-direction: column; overflow-x: hidden; overflow-y: auto; padding: 8px 4px; border-radius: 18px; }
    nav button { flex: 0 0 60px; }
    #main { padding: 8px 10px 10px 108px; }
    body.term #main { padding-bottom: 70px; }
    #dock { left: 108px; bottom: 12px; }
    .desk .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .filegrid, .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .pair, .modes { max-width: 720px; }
    .win { max-width: 1100px; width: 100%; margin: 0 auto; }
  }
  .freqhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .freqhead .ghost { width: auto; min-height: 40px; border-radius: 999px; }
  .modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .modes .ghost { min-height: 46px; padding: 0 6px; font-size: 13px; }
  #dock { position: fixed; left: 10px; right: 10px; bottom: calc(78px + env(safe-area-inset-bottom)); display: none; gap: 8px; z-index: 6; }
  #dock.on { display: flex; align-items: center; }
  #dock input { flex: 1; }

    // Only exact noise lines are dropped. The old rule hid every file whose name had a space.
    const lines = clean.split("\n").map(function (l) { return l.replace(/\r$/, ""); }).filter(function (l) {
      if (!l.trim() || /^exit \d+$/.test(l.trim()) || l === "Reading…" || l === "Termux") return false;

      if (/^\[COMMAND_EXIT/.test(l)) return false;
      if (/^(ls|bash): /.test(l)) return false;

    const files = lines.filter(function (n) { return !n.endsWith("/"); });

    files.sort(function (a, b) { return a.localeCompare(b); });
    const foot = document.getElementById("filefoot");
    const count = dirs.length + files.length;
    if (foot) foot.textContent = count + (count === 1 ? " item" : " items");
    function icons(list) {
      return list.map(function (name) {
        const dir = name.endsWith("/");
        const label = dir ? name.slice(0, -1) : name;
        return '<button class="ico' + (picked === join(label) ? " on" : "") + '" type="button" data-name="' + esc(name) + '" data-dir="' + (dir ? "1" : "0") + '"><i class="glyph ' + (dir ? "dir" : "file") + '"></i><em>' + esc(label) + "</em></button>";
      }).join("");
    }
    box.innerHTML = (dirs.length ? '<p class="sec">Folders</p><div class="filegrid">' + icons(dirs) + '</div>' : "") + (files.length ? '<p class="sec">Files</p><div class="filegrid">' + icons(files) + '</div>' : "") || "<p class='muted'>Empty.</p>";
    box.querySelectorAll(".ico").forEach(function (b) {
      b.onclick = function () {
        const name = b.getAttribute("data-name");
        if (b.getAttribute("data-dir") === "1") { cwd = join(name.slice(0, -1)); editing = false; render(); return; }
        picked = join(name);
        let text = "";
        try { text = String(MeridianPhone.readFile(picked)); } catch (e) { text = String(e); }

// Runs a command without showing it in any session. Uses the same async job channel as exec(),

function quietJob(cmd, done) {

  let r = "ok";
  try { r = String(MeridianPhone.startJob(cmd)); } catch (e) { return false; }
  if (r !== "ok") return false;
  quiet = true;
  const timer = setInterval(function () {
    let s = null;
    try { s = JSON.parse(MeridianPhone.jobStatus()); } catch (e) { return; }
    if (!s || !s.done) return;
    clearInterval(timer);
    quiet = false;
    done(cleanOut(s.out || ""));
  }, 400);

}
function loadSense() {

      senseText = out.replace(/\n?exit \d+\s*$/, "").trim();
      if (/Not allowed to start service|Termux was asleep/.test(senseText)) senseText = "";

}
function answerLine(cmd) {

  const last = blocks.length ? String(blocks[blocks.length - 1].out || "") : "";
  if (last.indexOf("maintainer") < 0 && last.indexOf("Y or I") < 0) return cmd;
  const keep = /^[nNoO]$/.test(t);
  const flag = keep ? "--force-confold" : "--force-confnew";
  return "for d in /proc/[0-9]*; do c=$(cat \"$d/comm\" 2>/dev/null) || continue; case \"$c\" in dpkg|apt|apt-get) kill \"$(basename \"$d\")\" 2>/dev/null || true ;; esac; done\nsleep 1\nrm -f \"$PREFIX/var/lib/dpkg/lock-frontend\" \"$PREFIX/var/lib/dpkg/lock\" \"$PREFIX/var/cache/apt/archives/lock\" \"$PREFIX/var/lib/apt/lists/lock\"\necho \"Answering " + t + "\"\ndpkg --configure -a --force-confdef " + flag;
}
let jobTimer = 0;
let execWaits = 0;
function pushBlock(log, block) {
  log.push(block);
  while (log.length > MAX_BLOCKS) log.shift();
}
function exec(title, cmd) {
  cmd = answerLine(cmd);

  const fixing = cmd.indexOf("Releasing a stuck") >= 0 || cmd.indexOf("pkg install -y termux-api") === 0;

    view = "console";
    pushBlock(blocks, { title: title, cmd: cmd, out: "Not connected. Press Connect.\nexit 1" });
    render();
    return;
  }

    return;
  }

    return;
  }

    let r = "ok";
    try { r = String(MeridianPhone.openInTermux(cmd)); } catch (e) { r = "missing"; }
    if (view !== "build") view = "console";
    const why = r === "ok"
      ? "This command needs a keyboard and a live screen, so it was opened in the Termux app. Come back here when it is done.\nexit 0"
      : r === "asleep"
        ? "This command needs a keyboard and a live screen. Termux is asleep, so it could not be opened. Open Termux once, then try again.\nexit 1"
        : "Termux is not installed.\nexit 1";
    pushBlock(blocks, { title: title, cmd: cmd, out: why });
    rememberCmd(cmd);
    saveSessions();
    render();
    return;
  }
  if (jobTimer) { clearInterval(jobTimer); jobTimer = 0; }
  if (view !== "build") view = "console";
  const log = blocks;
  let r = "ok";
  try { r = String(MeridianPhone.startJob(cmd)); } catch (e) { r = String(e); }
  if (r === "busy") { toast("Another command is still running."); return; }
  if (r === "missing") { pushBlock(log, { title: title, cmd: cmd, out: "Termux is not installed.\nexit 1" }); render(); return; }
  if (r !== "ok") { pushBlock(log, { title: title, cmd: cmd, out: r + "\nexit 1" }); render(); return; }
  busy = true;
  rememberCmd(cmd);
  try { MeridianPhone.keepAwake(true); } catch (e) {}
  pushBlock(log, { title: title, cmd: cmd, out: "Connecting to Termux." });
  render();
  const started = Date.now();
  jobTimer = setInterval(function () {
    let s = { done: false, out: "" };
    try { s = JSON.parse(MeridianPhone.jobStatus()); } catch (e) { return; }
    if (!s.done) {
      if (s.out) {
        const text = cleanOut(s.out);
        log[log.length - 1].out = text;
        if (blocks === log) {
          const node = document.getElementById("liveout");
          if (node) {
            node.textContent = explainOut(cmd, text);
            const term = document.getElementById("term");
            if (term) term.scrollTop = term.scrollHeight;
            else node.scrollTop = node.scrollHeight;
          }
          if (fixKind(text) && !document.getElementById("fixerr")) render();
        }
      } else if (Date.now() - started > 8000 && log[log.length - 1].out === "Connecting to Termux.") {
        log[log.length - 1].out = "Connecting to Termux. Still waiting. If this stays here, Termux is asleep: open it once, then press Stop and run again.";
        const node = document.getElementById("liveout");

}
function byName(name) {
  for (let i = 0; i < IDEAS.length; i++) if (IDEAS[i][0] === name) return IDEAS[i][2].slice();
  return null;
}
function localPlan(goal) {
  const g = goal.toLowerCase();
  if (/what (have|did) i install|what('s| is) installed|installed packages|list installed/.test(g)) return byName("Installed");
  if (/\bformat\b|\bwipe\b|\breset\b|\bfresh\b|all install|remove all|uninstall all/.test(g)) return byName("Format");
  for (let i = 0; i < IDEAS.length; i++) {
    const name = IDEAS[i][0].toLowerCase();
    if (name.length >= 4 && g.indexOf(name) >= 0) return IDEAS[i][2].slice();
  }
  const alias = [
    [/llama|gguf|\bllm\b|local model/, "Local model"],
    [/python|\bpip\b/, "Python"],
    [/node|npm|javascript/, "Node"],
    [/vulkan|opencl|\bgpu\b/, "GPU compute"],
    [/ubuntu/, "Ubuntu"],
    [/debian|proot/, "Debian"],
    [/clang|cmake|\bcompile\b|c\+\+/, "Compiler"],
    [/openssh|\bssh\b/, "Remote shell"],
    [/upgrade/, "Upgrade"],
    [/\bupdate\b/, "Update"]
  ];
  for (let i = 0; i < alias.length; i++) if (alias[i][0].test(g)) return byName(alias[i][1]);
  const skip = { the: 1, and: 1, for: 1, with: 1, from: 1, this: 1, that: 1, want: 1, lets: 1, let: 1, you: 1, your: 1, termux: 1, phone: 1, install: 1, build: 1, make: 1, please: 1, what: 1, clean: 1, will: 1, system: 1, automated: 1 };
  const words = g.replace(/[^a-z0-9+.-]+/g, " ").trim().split(/\s+/).filter(function (w) { return w.length > 2 && !skip[w]; });
  if (!words.length) return null;
  return null;
}
function showSteps(steps) {
  const box = document.getElementById("steps");
  if (!box) return;
  box.innerHTML = steps.map(function (s, i) {
    const cmd = typeof s === "string" ? s : s.cmd;
    const why = whyFor(cmd);
    return '<article class="plate stack"><p class="muted">' + esc(why) + '</p>' + cmdField(cmd, ' data-step="' + i + '"') + '<button class="ghost" type="button" data-runstep="' + i + '">Run</button></article>';
  }).join("");
  box.querySelectorAll("[data-runstep]").forEach(function (b) {
    b.onclick = function () { const area = box.querySelector("[data-step='" + b.getAttribute("data-runstep") + "']"); exec("Build", area ? area.value : ""); };
  });
}
function apiBase() {
  let base = (localStorage.getItem("m-base") || "https://api.x.ai/v1").trim();
  if (!/^https:\/\//i.test(base)) return base;
  base = base.replace(/\/+$/, "").replace(/\/chat\/completions$/i, "").replace(/\/messages$/i, "");
  if (/^https:\/\/api\.x\.ai$/i.test(base)) return "https://api.x.ai/v1";
  if (/^https:\/\/api\.openai\.com$/i.test(base)) return "https://api.openai.com/v1";
  if (/^https:\/\/api\.groq\.com$/i.test(base)) return "https://api.groq.com/openai/v1";
  if (/^https:\/\/openrouter\.ai$/i.test(base)) return "https://openrouter.ai/api/v1";
  if (/^https:\/\/api\.anthropic\.com$/i.test(base)) return "https://api.anthropic.com/v1";
  if (/^https:\/\/generativelanguage\.googleapis\.com$/i.test(base)) return "https://generativelanguage.googleapis.com/v1beta";
  return base;
}
function planGoal() {
  const goal = document.getElementById("goal").value.trim();
  if (!goal) return;
  const box = document.getElementById("steps");
  const key = localStorage.getItem("m-key") || "";
  const known = localPlan(goal);
  if (known) {
    showSteps(known);
    return;
  }
  if (!key) {
    if (box) box.innerHTML = "<p class='muted'>No API key on this phone, and there is no saved recipe for that. Open Key, paste yours, and save it. Plan will not invent a command.</p>";
    return;
  }
  const base = apiBase();
  let model = localStorage.getItem("m-model") || "grok-3";
  if (/api\.groq\.com/.test(base) && (model === "llama-3.3-70b-versatile" || model === "llama-3.1-8b-instant")) {

    if (askTicket !== ticket) return;

    if (btn) { btn.disabled = false; btn.textContent = "Write the steps"; }

    try { j = JSON.parse(raw); } catch (e) { j = null; }

      if (box) box.innerHTML = "<p class='muted'>The phone could not read the reply.</p>";
      return;
    }
    if (j.error) {
      if (box) box.innerHTML = "<p class='muted'>" + esc(j.error) + "</p>";
      return;
    }

    if (j.answer) html += "<article class='plate'><p>" + esc(j.answer) + "</p></article>";
    const steps = j.steps || [];
    if (!j.answer && !steps.length) {
      if (box) box.innerHTML = "<p class='muted'>The reply had no answer.</p>";
      return;
    }
    if (box) box.innerHTML = html;
